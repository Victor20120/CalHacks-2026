# ExpandRG as an installable package. Build it with `python build_package.py`, which first
# builds the dashboard into expandrg/pages/ so the wheel needs no Node.
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "expandrg"
dynamic = ["version"]
description = "A collaborative AI research assistant for groups that build numerical solvers, with a shared Super Brain."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.32",
    "python-dotenv>=1.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]
export = ["matplotlib>=3.8"]
papers = ["pypdf>=6.19"]  # reads a PDF paper for an onboarding lesson; .tex, .md and .txt papers need nothing

[project.scripts]
expandrg = "expandrg.__main__:main"

[tool.setuptools.dynamic]
version = { attr = "expandrg.__version__" }

[tool.setuptools]
include-package-data = false  # only what package-data lists: never backend/.env or backend/data

[tool.setuptools.packages.find]
include = ["expandrg*", "backend*", "local_connector*"]

[tool.setuptools.package-data]
expandrg = ["pages/*", "pages/**/*"]
